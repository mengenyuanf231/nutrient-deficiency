# Parameters
nc: 5  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024]  # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
assign_type: DynamicATSS
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SCDown, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SCDown, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2fCIB, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]  # 9
  - [-1, 1, PSA, [1024]] # 10

head:
  - [-1, 1, ChannelAttention_HSFPN, []] # 12
  - [-1, 1, nn.Conv2d, [256, 1]] # 13
  - [-1, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1]] # 13

  - [6, 1, ChannelAttention_HSFPN, []] # 15
  - [-1, 1, nn.Conv2d, [256, 1]] # 16
  - [13, 1, ChannelAttention_HSFPN, [4, False]] # 17
  - [[-1, -2], 1, Multiply, []] # 18
  - [[-1, 13], 1, Add, []] # 19
  - [-1, 3, C2f_DCMB_KAN, [256]] # 20 P4/16

  - [13, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1]] # 21
  - [3, 1, ChannelAttention_HSFPN, []] # 22
  - [-1, 1, nn.Conv2d, [256, 1]] # 23
  - [20, 1, ChannelAttention_HSFPN, [4, False]] # 24
  - [[-1, -2], 1, Multiply, []] # 25
  - [[-1, 20], 1, Add, []] # 26
  - [-1, 3, C2f_DCMB_KAN, [256]] # 27 P3/8

  - [-1, 1, nn.Conv2d, [256, 3, 2, 1]] # 28
  - [19, 1, ChannelAttention_HSFPN, []] # 29
  - [-1, 1, nn.Conv2d, [256, 1]] # 30
  - [27, 1, ChannelAttention_HSFPN, [4, False]] # 31
  - [[-1, -2], 1, Multiply, []] # 32
  - [[-1, 27], 1, Add, []] # 33
  - [-1, 3, C2f_DCMB_KAN, [256]] # 34 P4/16

  - [27, 1, nn.Conv2d, [256, 3, 2, 1]] # 35
  - [12, 1, ChannelAttention_HSFPN, []] # 36
  - [-1, 1, nn.Conv2d, [256, 1]] # 37
  - [34, 1, ChannelAttention_HSFPN, [4, False]] # 38
  - [[-1, -2], 1, Multiply, []] # 39
  - [[-1, 34], 1, Add, []] # 40
  - [-1, 3, C2f_DCMB_KAN, [256]] # 41 P5/32

  - [[26, 34, 40], 1, Detect, [nc]] # RTDETRDecoder(P3, P4, P5)
